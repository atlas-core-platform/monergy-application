name: T1 temporary formatting repair

on:
  push:
    branches:
      - delivery/t1-integrated-onboarding-documents

permissions:
  contents: write

jobs:
  format:
    name: Apply pinned Prettier and remove helper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0

      - name: Restore pinned frontend toolchain
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
          pnpm install --frozen-lockfile

      - name: Apply repository formatter exactly once
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/customer-web/e2e/onboarding.spec.ts \
            apps/customer-web/e2e/workspace.spec.ts \
            apps/customer-web/src/access/AccessEditor.tsx \
            apps/customer-web/src/access/AccessExperience.tsx \
            apps/customer-web/src/access/AccessOperations.tsx \
            apps/customer-web/src/access/AccessOverview.tsx \
            apps/customer-web/src/access/CustomerRelationships.tsx \
            apps/customer-web/src/access/ImportDrawer.tsx \
            apps/customer-web/src/access/TenantSetup.tsx \
            apps/customer-web/src/access/WorkspaceEntry.tsx \
            apps/customer-web/src/workspace/accessNavigation.tsx \
            apps/customer-web/src/workspace/WorkspaceHome.tsx \
            apps/customer-web/tests/Onboarding.test.tsx \
            build/uat/workspace.uat.spec.ts
          git diff --quiet -- \
            apps/customer-web/e2e/onboarding.spec.ts \
            apps/customer-web/e2e/workspace.spec.ts \
            apps/customer-web/src/access/AccessEditor.tsx \
            apps/customer-web/src/access/AccessExperience.tsx \
            apps/customer-web/src/access/AccessOperations.tsx \
            apps/customer-web/src/access/AccessOverview.tsx \
            apps/customer-web/src/access/CustomerRelationships.tsx \
            apps/customer-web/src/access/ImportDrawer.tsx \
            apps/customer-web/src/access/TenantSetup.tsx \
            apps/customer-web/src/access/WorkspaceEntry.tsx \
            apps/customer-web/src/workspace/accessNavigation.tsx \
            apps/customer-web/src/workspace/WorkspaceHome.tsx \
            apps/customer-web/tests/Onboarding.test.tsx \
            build/uat/workspace.uat.spec.ts && {
              echo "Pinned Prettier produced no candidate changes."
              exit 1
            }

      - name: Commit formatter output and remove this helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/customer-web/e2e/onboarding.spec.ts \
            apps/customer-web/e2e/workspace.spec.ts \
            apps/customer-web/src/access/AccessEditor.tsx \
            apps/customer-web/src/access/AccessExperience.tsx \
            apps/customer-web/src/access/AccessOperations.tsx \
            apps/customer-web/src/access/AccessOverview.tsx \
            apps/customer-web/src/access/CustomerRelationships.tsx \
            apps/customer-web/src/access/ImportDrawer.tsx \
            apps/customer-web/src/access/TenantSetup.tsx \
            apps/customer-web/src/access/WorkspaceEntry.tsx \
            apps/customer-web/src/workspace/accessNavigation.tsx \
            apps/customer-web/src/workspace/WorkspaceHome.tsx \
            apps/customer-web/tests/Onboarding.test.tsx \
            build/uat/workspace.uat.spec.ts
          git rm .github/workflows/t1-format-repair.yml
          git commit -m "T1-03: apply pinned Prettier formatting"
          git push origin HEAD:delivery/t1-integrated-onboarding-documents
