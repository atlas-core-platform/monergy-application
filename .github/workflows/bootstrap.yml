name: Candidate readiness

on:
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Select impacted verification or the governed complete regression.
        required: true
        default: impacted
        type: choice
        options:
          - impacted
          - full_regression

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: impact-aware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed-file and architecture impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.range.outputs.base_sha }}
      head_sha: ${{ steps.range.outputs.head_sha }}
      requested_mode: ${{ steps.range.outputs.requested_mode }}
      effective_mode: ${{ steps.impact.outputs.effective_mode }}
      full_regression: ${{ steps.impact.outputs.full_regression }}
      documentation_only: ${{ steps.impact.outputs.documentation_only }}
      run_service_tests: ${{ steps.impact.outputs.run_service_tests }}
      run_frontend_tests: ${{ steps.impact.outputs.run_frontend_tests }}
      run_browser: ${{ steps.impact.outputs.run_browser }}
      run_persistence: ${{ steps.impact.outputs.run_persistence }}
      run_job_audit: ${{ steps.impact.outputs.run_job_audit }}
      run_d11: ${{ steps.impact.outputs.run_d11 }}
      run_oci: ${{ steps.impact.outputs.run_oci }}
      run_dependency_security: ${{ steps.impact.outputs.run_dependency_security }}
      run_owner_integration: ${{ steps.impact.outputs.run_owner_integration }}
      run_local_uat: ${{ steps.impact.outputs.run_local_uat }}
      oci_services: ${{ steps.impact.outputs.oci_services }}
    steps:
      - name: Check out repository with governed ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve deterministic comparison range
        id: range
        shell: pwsh
        env:
          REQUESTED_DISPATCH_MODE: ${{ inputs.verification_mode }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = $env:HEAD_SHA
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the governed main comparison base.' }
          $base = [string](git merge-base origin/main $head)
          $mode = if ($env:REQUESTED_DISPATCH_MODE -eq 'full_regression') { 'FullRegression' } else { 'PullRequest' }
          if ([string]::IsNullOrWhiteSpace($base)) { throw 'The candidate has no governed merge base with main.' }
          git cat-file -e "$base^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Comparison base $base is unavailable." }

          "base_sha=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "head_sha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "requested_mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Produce machine-readable impact classification
        id: impact
        shell: pwsh
        run: |
          ./build/ci/Get-CiImpact.ps1 `
            -BaseSha '${{ steps.range.outputs.base_sha }}' `
            -HeadSha '${{ steps.range.outputs.head_sha }}' `
            -Mode '${{ steps.range.outputs.requested_mode }}' `
            -OutputPath .artifacts/ci/impact.json `
            -EmitGitHubOutputs
          Get-Content -LiteralPath .artifacts/ci/impact.json -Raw |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  universal:
    name: Universal clean quality and security baseline
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
          pnpm --version

      - name: Install pinned security tools
        shell: bash
        run: |
          mkdir -p .toolcache/security
          curl --fail --location --silent --show-error \
            --output .toolcache/security/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          echo '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  .toolcache/security/syft.tar.gz' | sha256sum --check
          tar -xzf .toolcache/security/syft.tar.gz -C .toolcache/security syft
          curl --fail --location --silent --show-error \
            --output .toolcache/security/grype.tar.gz \
            https://github.com/anchore/grype/releases/download/v0.118.0/grype_0.118.0_linux_amd64.tar.gz
          echo '1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2  .toolcache/security/grype.tar.gz' | sha256sum --check
          tar -xzf .toolcache/security/grype.tar.gz -C .toolcache/security grype
          curl --fail --location --silent --show-error \
            --output .toolcache/security/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .toolcache/security/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .toolcache/security/gitleaks.tar.gz -C .toolcache/security gitleaks
          chmod +x .toolcache/security/syft .toolcache/security/grype .toolcache/security/gitleaks
          echo "$GITHUB_WORKSPACE/.toolcache/security" >> "$GITHUB_PATH"

      - name: Restore pinned dependencies
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Restore

      - name: Verify formatting
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task FormatCheck

      - name: Lint and source security analysis
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Lint

      - name: Compile and bundle
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Build

      - name: Run architecture-boundary tests
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task ArchitectureTest

      - name: Scan repository history and candidate content for secrets
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task SecretScan

      - name: Reproduce the governed impact classification
        shell: pwsh
        run: |
          ./build/ci/Get-CiImpact.ps1 `
            -BaseSha '${{ needs.classify.outputs.base_sha }}' `
            -HeadSha '${{ needs.classify.outputs.head_sha }}' `
            -Mode '${{ needs.classify.outputs.requested_mode }}' `
            -OutputPath .artifacts/ci/impact.json

      - name: Verify D15 impact policy and negative self-tests
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D15Verification

      - name: Run impacted service contract and historical verification
        shell: pwsh
        run: ./build/ci/Invoke-ImpactedVerification.ps1 -ClassificationPath .artifacts/ci/impact.json

      - name: Generate repository CycloneDX SBOM
        if: needs.classify.outputs.run_dependency_security == 'true'
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Sbom

      - name: Run dependency and composition vulnerability checks
        if: needs.classify.outputs.run_dependency_security == 'true'
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task VulnerabilityScan

      - name: Verify whitespace
        if: always()
        shell: pwsh
        run: git diff --check

      - name: Upload universal machine-readable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: impact-aware-universal-${{ github.run_id }}
          path: |
            .artifacts/ci/impact.json
            .artifacts/d16/*.json
            .artifacts/security/*.json
            .artifacts/tests/*.trx
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Impacted browser evidence
    needs: [classify, universal]
    if: needs.classify.outputs.run_browser == 'true' && needs.universal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Restore and build browser target
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
          ./build/Invoke-Toolchain.ps1 -Task Restore
          ./build/Invoke-Toolchain.ps1 -Task Build
      - name: Install Chromium
        shell: bash
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser verification
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task BrowserTest

  persistence:
    name: Impacted D09 physical persistence
    needs: [classify, universal]
    if: needs.classify.outputs.run_persistence == 'true' && needs.universal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
          ./build/Invoke-Toolchain.ps1 -Task Restore
      - name: Verify PostgreSQL and S3-compatible persistence
        shell: pwsh
        run: ./build/d09/Invoke-D09Persistence.ps1 -Reset

  job-audit:
    name: Impacted D10 physical Job Management and Audit
    needs: [classify, universal]
    if: needs.classify.outputs.run_job_audit == 'true' && needs.universal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
          ./build/Invoke-Toolchain.ps1 -Task Restore
      - name: Verify durable Job Management and Audit propagation
        shell: pwsh
        run: ./build/d10/Invoke-D10Persistence.ps1 -Reset

  d11-linux-runtime:
    name: Impacted D11 persisted-reporting Linux integration
    needs: [classify, universal]
    if: needs.classify.outputs.run_d11 == 'true' && needs.universal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
      - name: Prepare the clean pinned D11 profile
        shell: pwsh
        run: |
          ./build/local/Invoke-MonergyLocal.ps1 -Action Prepare
          ./build/local/Test-MonergyLocalPreparedIdentity.ps1
      - name: Install Chromium for real D11 browser evidence
        shell: bash
        run: pnpm exec playwright install --with-deps chromium
      - name: Start seed and verify the clean D11 profile
        shell: pwsh
        run: |
          ./build/local/Invoke-MonergyLocal.ps1 -Action Start
          ./build/local/Invoke-MonergyLocal.ps1 -Action Seed
          ./build/local/Invoke-MonergyLocal.ps1 -Action Verify
      - name: Run persisted-reporting browser flow
        shell: bash
        run: pnpm exec playwright test --config build/local/playwright.d11.config.ts
      - name: Verify restart outage timeout and lost-acknowledgement recovery
        shell: pwsh
        run: ./build/local/Invoke-D11RuntimeEvidence.ps1
      - name: Capture bounded D11 controller status
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .artifacts/d11/hosted -Force | Out-Null
          ./build/local/Invoke-MonergyLocal.ps1 -Action Status -Json | Set-Content -LiteralPath .artifacts/d11/hosted/controller-status.json -Encoding utf8
          Get-Content -LiteralPath .artifacts/d11/hosted/controller-status.json -Raw | ConvertFrom-Json -ErrorAction Stop | Out-Null
      - name: Stop only the owned D11 application runtime
        if: always()
        shell: pwsh
        run: ./build/local/Invoke-MonergyLocal.ps1 -Action Stop
      - name: Upload reviewed D11 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d11-persisted-reporting-${{ github.run_id }}
          path: |
            .artifacts/d11/remediation-r2/linux/*.json
            .artifacts/d11/hosted/controller-status.json
            .artifacts/d11/persisted-reporting/verification-latest.json
            .artifacts/d11/playwright/results.json
            .artifacts/d11/playwright/test-results/**/trace.zip
            .artifacts/d11/playwright/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

  oci:
    name: Impacted OCI build SBOM and vulnerability evidence
    needs: [classify, universal]
    if: needs.classify.outputs.run_oci == 'true' && needs.universal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned image security tools
        shell: bash
        run: |
          mkdir -p .toolcache/security
          curl --fail --location --silent --show-error \
            --output .toolcache/security/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          echo '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  .toolcache/security/syft.tar.gz' | sha256sum --check
          tar -xzf .toolcache/security/syft.tar.gz -C .toolcache/security syft
          curl --fail --location --silent --show-error \
            --output .toolcache/security/grype.tar.gz \
            https://github.com/anchore/grype/releases/download/v0.118.0/grype_0.118.0_linux_amd64.tar.gz
          echo '1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2  .toolcache/security/grype.tar.gz' | sha256sum --check
          tar -xzf .toolcache/security/grype.tar.gz -C .toolcache/security grype
          chmod +x .toolcache/security/syft .toolcache/security/grype
          echo "$GITHUB_WORKSPACE/.toolcache/security" >> "$GITHUB_PATH"
      - name: Build scan and identify only selected images
        shell: pwsh
        env:
          OCI_SERVICES_JSON: ${{ needs.classify.outputs.oci_services }}
        run: |
          $serviceIds = @($env:OCI_SERVICES_JSON | ConvertFrom-Json)
          ./build/hosted-oci-evidence.ps1 -ServiceId $serviceIds
      - name: Verify complete D02 OCI evidence matrix
        if: needs.classify.outputs.full_regression == 'true'
        shell: pwsh
        env:
          MONERGY_REQUIRE_FULL_OCI_EVIDENCE: 'true'
        run: ./build/verify-toolchain.ps1 -D09ForwardRegression -D10ForwardRegression
      - name: Upload OCI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: impact-aware-oci-${{ github.run_id }}
          path: |
            .artifacts/oci/images.json
            .artifacts/oci/evidence-matrix.json
            .artifacts/oci/sboms/*.json
            .artifacts/oci/scans/*.json
          if-no-files-found: error
          retention-days: 14

  owner-integration:
    name: Impacted Tenant Access owner integration
    needs: [classify, universal]
    if: needs.classify.outputs.run_owner_integration == 'true' && needs.universal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: am-ci-disposable-admin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pinned .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Verify additive migration scope and negative cases
        shell: pwsh
        run: ./build/am05/Get-MigrationOverlay.ps1 -SelfTest
      - name: Restore verified external AM source
        run: python3 build/am05/restore-verification-source.py
      - name: Locked restore and analyzer builds
        shell: bash
        run: |
          for project in tests/persistence/Monergy.AccessIntegration.Tests build/local/Monergy.LocalAccessAuditHost build/Monergy.DatabaseMigrator .artifacts/am05/access-management/tools/Monergy.AccessManagement.Migrations .artifacts/am05/access-management/tools/Monergy.AccessManagement.DeliveryReference; do
            dotnet restore "$project" --locked-mode
            dotnet build "$project" --configuration Release --no-restore
          done
      - name: Verify owner formatting
        run: |
          for project in contracts/Monergy.Contracts shared/platform/Monergy.Platform services/customer-identity services/audit tests/persistence/Monergy.AccessIntegration.Tests build/local/Monergy.LocalAccessAuditHost; do
            dotnet format "$project" --verify-no-changes --no-restore
          done
      - name: Create isolated databases and scoped credentials
        run: |
          bash .artifacts/am05/access-management/build/prepare-ci-databases.sh "${{ job.services.postgres.id }}"
          bash build/am05/prepare-owner-databases.sh "${{ job.services.postgres.id }}"
      - name: Apply owner migrations and bootstrap bindings
        run: |
          (cd .artifacts/am05/access-management && bash build/provision-ci-tenants.sh "${{ job.services.postgres.id }}")
          bash build/am05/provision-owner-databases.sh "${{ job.services.postgres.id }}"
      - name: Verify owner behavior, atomicity and least privilege
        run: dotnet test tests/persistence/Monergy.AccessIntegration.Tests --configuration Release --no-build --logger "trx;LogFileName=am05-owners.trx" --results-directory .artifacts/am05/results
      - name: Verify real AM, C&I and Audit processes
        env:
          AM05_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python3 build/am05/verify-process-integration.py | tee .artifacts/am05/process-results.log
      - name: Capture formatter suggestions on failure
        if: failure()
        run: |
          mkdir -p .artifacts/am05
          for project in contracts/Monergy.Contracts shared/platform/Monergy.Platform services/customer-identity services/audit tests/persistence/Monergy.AccessIntegration.Tests build/local/Monergy.LocalAccessAuditHost; do
            dotnet format "$project" --no-restore || true
          done
          git diff --binary > .artifacts/am05/formatter-suggestions.patch
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-owner-integration-${{ github.run_id }}
          path: |
            .artifacts/am05/results/*.trx
            .artifacts/am05/*.log
            .artifacts/am05/*.patch
          if-no-files-found: warn

  windows-uat-profile:
    name: Impacted Windows UAT profile permissions
    needs: [classify, universal]
    if: needs.classify.outputs.run_local_uat == 'true' && needs.universal.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify private profile reads and recovery in Windows PowerShell 5.1
        shell: powershell
        run: ./build/uat/Test-WindowsProfilePermissions.ps1
      - name: Verify private profile reads and recovery in PowerShell 7
        shell: pwsh
        run: ./build/uat/Test-WindowsProfilePermissions.ps1

  docker-uat:
    name: Impacted Local Docker UAT acceptance
    needs: [classify, universal]
    if: needs.classify.outputs.run_local_uat == 'true' && needs.universal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Verify diagnostic credential redaction
        run: python build/uat/collect-diagnostics.py --self-test
      - name: Start isolated Docker UAT profile
        shell: pwsh
        run: ./build/uat/Invoke-MonergyUat.ps1 -Action Start -Profile ci -Port 4173 -EnableOnboarding
      - name: Verify actual owner boundaries, security, delivery and restarts
        shell: bash
        run: |
          export MONERGY_UAT_DISPOSABLE="$(python -c "import json; print(json.load(open('.artifacts/uat/ci/profile.json'))['instanceId'])")"
          python build/uat/verify-uat.py
          python build/uat/verify-onboarding.py
      - name: Install pinned browser toolchain
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Verify real administration browser journeys
        run: pnpm exec playwright test --config build/uat/playwright.config.ts
      - name: Verify onboarding presentation and access-entry regressions
        run: pnpm exec playwright test --config build/uat/onboarding.playwright.config.ts
      - name: Capture redacted container diagnostics before cleanup
        if: failure()
        run: python build/uat/collect-diagnostics.py --profile ci
      - name: Preserve credential-free acceptance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-local-uat-${{ github.run_id }}
          path: |
            .artifacts/uat-acceptance.json
            .artifacts/uat-browser-results.json
            .artifacts/uat-workspace.png
            .artifacts/onboarding-acceptance.json
            .artifacts/onboarding-browser-results.json
            .artifacts/onboarding-setup.png
            .artifacts/onboarding-relationship-review.png
            .artifacts/uat-diagnostics.log
            .artifacts/uat-test-results/**
          if-no-files-found: warn
      - name: Stop disposable CI profile
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .artifacts/uat/ci/profile.json) { ./build/uat/Invoke-MonergyUat.ps1 -Action Reset -Profile ci -ConfirmReset }
