name: Bootstrap

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Verify technology-neutral baseline
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run bootstrap quality gates
        shell: pwsh
        run: ./build/Invoke-Bootstrap.ps1 -Task All

      - name: Verify whitespace
        shell: pwsh
        run: git diff --check
