name: Product technology toolchain

on:
  push:
    branches:
      - main
      - delivery/mwp03-d02-product-technology-toolchain
      - delivery/mwp03-d03-vs02-evidence-financial-truth
      - delivery/mwp03-d04-financial-profile-authority-expansion
      - delivery/mwp03-d05-financial-rules-calculation-lineage
      - delivery/mwp03-d06-integration-gateway-core
      - delivery/mwp03-d07-authorized-search-provenance
      - delivery/mwp03-d08-trusted-financial-summary-export
      - delivery/mwp03-d09-persistent-relational-data-foundation
      - delivery/mwp03-d10-durable-job-audit-propagation
      - delivery/mwp03-d12-document-reprocessing
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d05-lifecycle-probe:
    name: D05 bounded frontend lifecycle probe
    if: github.ref == 'refs/heads/delivery/mwp03-d05-financial-rules-calculation-lineage' || github.head_ref == 'delivery/mwp03-d05-financial-rules-calculation-lineage'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out remediation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Restore pinned frontend dependencies
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
      - name: Run isolated lifecycle reproduction
        run: pnpm --filter @monergy/customer-web exec vitest run --config tests/lifecycle.config.ts
      - name: Run twenty consecutive executions without retry
        run: node build/probe-frontend-lifecycle.mjs
      - name: Preserve probe evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d05-frontend-lifecycle-probe-${{ github.run_id }}
          path: .artifacts/d05-lifecycle-probe/
          if-no-files-found: error
          retention-days: 30

  toolchain:
    needs: d05-lifecycle-probe
    if: always() && (needs.d05-lifecycle-probe.result == 'success' || needs.d05-lifecycle-probe.result == 'skipped')
    name: Verify D01-D10 controlled implementation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@12.4.1
          pnpm --version

      - name: Restore locked dependencies
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Restore

      - name: Verify formatting
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task FormatCheck

      - name: Lint and source security analysis
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Lint

      - name: Compile and bundle
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Build

      - name: Run unit and component tests
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Test

      - name: Run architecture-boundary tests
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task ArchitectureTest

      - name: Install Chromium for browser evidence
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke test
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task BrowserTest

      - name: Install pinned supply-chain tools
        shell: bash
        run: |
          mkdir -p .toolcache/security
          curl --fail --location --silent --show-error \
            --output .toolcache/security/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          echo '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  .toolcache/security/syft.tar.gz' | sha256sum --check
          tar -xzf .toolcache/security/syft.tar.gz -C .toolcache/security syft
          curl --fail --location --silent --show-error \
            --output .toolcache/security/grype.tar.gz \
            https://github.com/anchore/grype/releases/download/v0.118.0/grype_0.118.0_linux_amd64.tar.gz
          echo '1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2  .toolcache/security/grype.tar.gz' | sha256sum --check
          tar -xzf .toolcache/security/grype.tar.gz -C .toolcache/security grype
          curl --fail --location --silent --show-error \
            --output .toolcache/security/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .toolcache/security/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .toolcache/security/gitleaks.tar.gz -C .toolcache/security gitleaks
          chmod +x .toolcache/security/syft .toolcache/security/grype .toolcache/security/gitleaks
          echo "$GITHUB_WORKSPACE/.toolcache/security" >> "$GITHUB_PATH"

      - name: Build, identify, SBOM and scan twelve OCI images
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task HostedOciEvidence

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task Sbom

      - name: Run dependency and artifact vulnerability checks
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task VulnerabilityScan

      - name: Scan repository history and candidate content for secrets
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task SecretScan

      - name: Generate and verify candidate release manifest
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task ReleaseManifest

      - name: Verify D01 regression
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D01Verification

      - name: Verify D02 realization and negative self-tests
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D02Verification

      - name: Verify VS-02 implementation and negative self-tests
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D03Verification

      - name: Verify Financial Profile authority and negative self-tests
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D04Verification

      - name: Verify Financial Rules forward regression and preserve raw machine-readable evidence
        if: always()
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D05Regression

      - name: Verify Integration Gateway core and negative self-tests
        if: always()
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D06Verification

      - name: Verify authorized search and provenance retrieval
        if: always()
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D07Verification

      - name: Verify trusted financial summary, drill-down and export
        if: always()
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D08Verification

      - name: Verify persistent relational data foundation
        if: always()
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D09Verification

      - name: Verify D09 PostgreSQL and S3-compatible persistence
        if: always()
        shell: pwsh
        run: ./build/d09/Invoke-D09Persistence.ps1 -Reset

      - name: Verify durable Job Management and Audit propagation
        if: always()
        shell: pwsh
        run: ./build/Invoke-Toolchain.ps1 -Task D10Verification

      - name: Verify D10 PostgreSQL durability and Audit propagation
        if: always()
        shell: pwsh
        run: ./build/d10/Invoke-D10Persistence.ps1 -Reset

      - name: Upload raw machine-readable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d05-financial-rules-lineage-evidence-${{ github.run_id }}
          path: |
            .artifacts/components/
            .artifacts/provenance/
            .artifacts/release/
            .artifacts/security/
            .artifacts/tests/
            .artifacts/d05/
            .artifacts/oci/images.json
            .artifacts/oci/evidence-matrix.json
            .artifacts/oci/sboms/
            .artifacts/oci/scans/
          if-no-files-found: warn
          retention-days: 14

      - name: Detect direct push to main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MONERGY_REPOSITORY: ${{ github.repository }}
          MONERGY_COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:MONERGY_REPOSITORY/commits/$env:MONERGY_COMMIT_SHA/pulls"
          $pullRequests = @(Invoke-RestMethod -Method Get -Uri $uri -Headers $headers)
          $mergedToMain = @($pullRequests | Where-Object {
            $_.merged_at -and $_.base.ref -eq 'main'
          })
          if ($mergedToMain.Count -eq 0) {
            Write-Output '::warning title=Direct push to main detected::GitHub Free cannot prevent this push. Review it under the MWP-03-D01 governance exception.'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Direct push detection: FLAGGED'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Commit ``$env:MONERGY_COMMIT_SHA`` was pushed directly to ``main`` without an associated merged pull request. Detection does not imply prevention."
          }
          else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Direct push detection: PR-associated'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Commit ``$env:MONERGY_COMMIT_SHA`` is associated with merged pull request #$($mergedToMain[0].number)."
          }

      - name: Verify whitespace
        if: always()
        shell: pwsh
        run: git diff --check
