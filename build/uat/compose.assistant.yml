# Explicit opt-in overlay. No new host port or business topology member.
services:
  assistant-bootstrap:
    image: monergy-local-uat:${COMPOSE_PROJECT_NAME}
    pull_policy: never
    user: '${UAT_UID:-1654}'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    restart: 'no'
    working_dir: /app/bootstrap
    command: [Monergy.DatabaseMigrator.dll, --local-uat-assistant-bootstrap, /run/secrets/bootstrap-profile]
    environment:
      MONERGY_LOCAL_UAT_BOOTSTRAP: '1'
    secrets: [bootstrap-profile]
    depends_on:
      postgres: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    # No business service depends on this optional owner-store initializer.
  bootstrap:
    build:
      args:
        VITE_MONERGY_ASSISTANT_ENABLED: 'true'
  workspace:
    secrets:
      - source: assistant-catalogue
        target: assistant-catalogue
  access-management:
    secrets:
      - source: assistant-operator-control
        target: assistant-operator-control
  ai-intelligence:
    secrets:
      - source: assistant-catalogue
        target: assistant-catalogue
  knowledge-runtime:
    image: monergy-knowledge-local:${COMPOSE_PROJECT_NAME}
    build:
      context: '${UAT_SYSTEM_EXPERT_ROOT}'
      dockerfile: build/assistant/Dockerfile
    pull_policy: never
    network_mode: service:workspace
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=8m,mode=1777']
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    environment:
      MONERGY_KNOWLEDGE_CONFIG: /run/secrets/assistant-runtime-config
    secrets:
      - source: assistant-runtime-config
        target: assistant-runtime-config
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5122/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      workspace: { condition: service_started }
secrets:
  assistant-catalogue:
    file: '${UAT_CONFIG_ROOT}/assistant-catalogue.json'
  assistant-runtime-config:
    file: '${UAT_CONFIG_ROOT}/assistant-runtime.json'
  assistant-operator-control:
    file: '${UAT_CONFIG_ROOT}/assistant-operator-control'
