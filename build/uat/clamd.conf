# LOCAL onboarding only. No host-published scanner port or file-path scanning.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 600
TCPSocket 3310
TCPAddr 127.0.0.1
TemporaryDirectory /tmp
LogTime yes
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 1M
LogClean no
MaxThreads 2
MaxQueue 4
ReadTimeout 5
CommandReadTimeout 5
SendBufTimeout 500
StreamMaxLength 1M
MaxFileSize 2M
MaxScanSize 16M
MaxScanTime 3000
MaxRecursion 16
MaxFiles 100
ScanArchive yes
ScanPDF yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanHTML yes
ScanMail yes
AlertEncrypted yes
AlertExceedsMax yes
HeuristicAlerts yes
ConcurrentDatabaseReload no
SelfCheck 300
