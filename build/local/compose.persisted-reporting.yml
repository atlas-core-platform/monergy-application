name: monergy-d11-persisted-reporting
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: ${D11_POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${D11_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      MONERGY_EVIDENCE_OWNER_PASSWORD: ${MONERGY_EVIDENCE_OWNER_PASSWORD}
      MONERGY_EVIDENCE_RUNTIME_PASSWORD: ${MONERGY_EVIDENCE_RUNTIME_PASSWORD}
      MONERGY_FINANCIAL_PROFILE_OWNER_PASSWORD: ${MONERGY_FINANCIAL_PROFILE_OWNER_PASSWORD}
      MONERGY_FINANCIAL_PROFILE_RUNTIME_PASSWORD: ${MONERGY_FINANCIAL_PROFILE_RUNTIME_PASSWORD}
      MONERGY_FINANCIAL_RULES_OWNER_PASSWORD: ${MONERGY_FINANCIAL_RULES_OWNER_PASSWORD}
      MONERGY_FINANCIAL_RULES_RUNTIME_PASSWORD: ${MONERGY_FINANCIAL_RULES_RUNTIME_PASSWORD}
      MONERGY_REPORTING_OWNER_PASSWORD: ${MONERGY_REPORTING_OWNER_PASSWORD}
      MONERGY_REPORTING_RUNTIME_PASSWORD: ${MONERGY_REPORTING_RUNTIME_PASSWORD}
      MONERGY_AUDIT_OWNER_PASSWORD: ${MONERGY_AUDIT_OWNER_PASSWORD}
      MONERGY_AUDIT_RUNTIME_PASSWORD: ${MONERGY_AUDIT_RUNTIME_PASSWORD}
    ports:
      - '127.0.0.1:55434:5432'
    volumes:
      - d11-postgres:/var/lib/postgresql
      - ./bootstrap-persisted-reporting.sh:/docker-entrypoint-initdb.d/010-monergy-d11.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: 'server -dir=/data -s3 -s3.port=8333 -s3.ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json -ip=seaweedfs'
    ports:
      - '127.0.0.1:58334:8333'
    volumes:
      - d11-seaweed:/data
      - ${D11_S3_CONFIG_PATH}:/etc/seaweedfs/s3.json:ro

volumes:
  d11-postgres:
  d11-seaweed:
