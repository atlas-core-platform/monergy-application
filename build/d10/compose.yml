name: monergy-d10
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: ${D10_POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${D10_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      MONERGY_JOB_MANAGEMENT_OWNER_PASSWORD: ${MONERGY_JOB_MANAGEMENT_OWNER_PASSWORD}
      MONERGY_JOB_MANAGEMENT_RUNTIME_PASSWORD: ${MONERGY_JOB_MANAGEMENT_RUNTIME_PASSWORD}
      MONERGY_REPORTING_OWNER_PASSWORD: ${MONERGY_REPORTING_OWNER_PASSWORD}
      MONERGY_REPORTING_RUNTIME_PASSWORD: ${MONERGY_REPORTING_RUNTIME_PASSWORD}
      MONERGY_AUDIT_OWNER_PASSWORD: ${MONERGY_AUDIT_OWNER_PASSWORD}
      MONERGY_AUDIT_RUNTIME_PASSWORD: ${MONERGY_AUDIT_RUNTIME_PASSWORD}
    ports:
      - '55433:5432'
    volumes:
      - d10-postgres:/var/lib/postgresql
      - ./bootstrap-postgres.sh:/docker-entrypoint-initdb.d/010-monergy-d10.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  d10-postgres:
